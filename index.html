#cm{margin-top:12px}

function mapEvent(ev){if(!ev.s||!ev.a)return null;
 const tk=ev.s.toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' '),has=a=>a.some(w=>tk.includes(w)||(w.length>4&&tk.some(t=>t.startsWith(w))));

 const t=has(['absent','awol','absence'])?'absent':has(['official','business','travel','client','training','seminar','offsite','conference','field','ob'])?'official':has(['leave','vacation','sick','pto','holiday','off','vl','sl'])?'leave':null;if(!t)return null;
 const dp=v=>v.trim().slice(0,4)+'-'+v.trim().slice(4,6)+'-'+v.trim().slice(6,8);
 const from=dp(ev.a);let to=ev.b?dp(ev.b):from;
 if(ev.b&&ev.b.indexOf('T')<0){const d=new Date(+to.slice(0,4),+to.slice(5,7)-1,+to.slice(8,10)-1);to=ds(d)}
 if(to<from)to=from;
 if(SCH.some(x=>x.i===i&&x.t===t&&x.from===from&&x.to===to))return null;

function importICS(txt){const L=[],CR=String.fromCharCode(13),TB=String.fromCharCode(9);
 txt.split(NL).forEach(l=>{l=l.split(CR).join('');if((l[0]===' '||l[0]===TB)&&L.length)L[L.length-1]+=l.slice(1);else L.push(l)});
 let ev=null,n=0,sk=0;
 L.forEach(l=>{if(l==='BEGIN:VEVENT')ev={};else if(l==='END:VEVENT'&&ev){const r=mapEvent(ev);if(r){SCH.push(r);n++}else sk++;ev=null}
  else if(ev){const k=l.indexOf(':');if(k>0){const key=l.slice(0,k).split(';')[0],v=l.slice(k+1);if(key==='SUMMARY')ev.s=v;else if(key==='DTSTART')ev.a=v;else if(key==='DTEND')ev.b=v}}});
 smsg='Imported '+n+' event(s). Skipped '+sk+' (no staff name or keyword match, or already added). Repeating events are not expanded.';saveSch();drawSched();applySched()}

 else if(id==='qa'){const f=$('qf').value,to=$('qt').value||f;if(!f||to<f){smsg='Pick valid dates (end date on or after start date).';drawSched();return}
  SCH.push({id:''+Date.now()+Math.random(),i:+$('qw').value,t:$('qy').value,from:f,to,n:$('qo').value.trim()});smsg='Added.';saveSch();drawSched();applySched()}

}

{const a=new T.Mesh(new T.CylinderGeometry(.32,.32,.16,20),M(0xf9a8d4));a.position.y=.08;const b=new T.Mesh(new T.CylinderGeometry(.22,.22,.12,20),M(0xffffff));b.position.y=.22;const c=new T.Mesh(new T.CylinderGeometry(.02,.02,.16,8),M(0x60a5fa));c.position.y=.36;cake.add(a,b,c)}
