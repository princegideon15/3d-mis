P.forEach(p=>{p.lk=null;p.sel.value=p.status;p.dot.style.background=ST[p.status].c});
P.forEach(p=>setStatus(p,p.base,true));
applySched(true);workCheck(hourNow(),true);setInterval(()=>applySched(),30000);getPlan();setInterval(getPlan,30000);
const clk=new T.Clock();let tvT=0;
function tick(){requestAnimationFrame(tick);
 const dt=Math.min(.05,clk.getDelta()),t=clk.elapsedTime;
 P.forEach(p=>{const r=p.root;if(!p.path.length)p.v=0;p.body.position.z=p.mode==='sit'?.15:0;
  if(p.path.length){const w=p.path[0],dx=w.x-r.position.x,dz=w.z-r.position.z,d=Math.hypot(dx,dz),s=dt*(SM?stepV(p,d,dt):2.4);
   if(d<=s){r.position.x=w.x;r.position.z=w.z;p.path.shift();if(!p.path.length)arrived(p)}
   else{r.position.x+=dx/d*s;r.position.z+=dz/d*s;r.rotation.y=SM?turnTo(r.rotation.y,Math.atan2(dx,dz),dt):Math.atan2(dx,dz)}
   if(p.mode==='walk'){const k=Math.sin(t*8+p.ph);p.L.rotation.x=k*.6;p.R.rotation.x=-k*.6;p.AL.rotation.x=-k*.5;p.AR.rotation.x=k*.5;p.body.position.y=.42+Math.abs(k)*.03}}
  else if(p.mode==='sit'){const k=t*13+p.ph;p.AL.rotation.x=-1.35+Math.sin(k)*.1;p.AR.rotation.x=-1.35+Math.cos(k*1.3)*.1;p.head.rotation.x=.12+Math.sin(t*.7+p.ph)*.05;p.head.rotation.y=Math.sin(t*.35+p.ph)*(Math.sin(t*.2+p.ph)>.6?.35:.04);p.tex.offset.y=(p.tex.offset.y+dt*.12)%1}
  else{p.body.position.y=.42+Math.sin(t*2+p.ph)*.01;p.AL.rotation.x=Math.sin(t*1.5+p.ph)*.06;p.AR.rotation.x=-Math.sin(t*1.5+p.ph)*.06;p.head.rotation.y=Math.sin(t*.6+p.ph)*.4}});
 workCheck(hourNow());life(t);bdUpdate(t,dt);
 leds.forEach((m,i)=>m.color.setHex(Math.sin(t*(2+i%5)+i*7)>0?0x22ff66:0x0f3b1e));
 if(W==='rain'){for(let i=0;i<N;i++){const d=rd[i];d[1]-=dt*20;if(d[1]<0)d[1]=25;rp.set([d[0],d[1],d[2],d[0],d[1]+.7,d[2]],i*6)}rg.attributes.position.needsUpdate=true}
 clouds.forEach(g=>{g.position.x+=dt*.8;if(g.position.x>70)g.position.x=-70});
 env(hourNow());decorUpdate(hourNow(),dt);if(live)$('sl').value=hourNow();
 if((tvT+=dt)>1){tvT=0;drawTV()}
 {let mx=0,mz=0;if(keys.w||keys.arrowup){mx-=Math.sin(th);mz-=Math.cos(th)}if(keys.s||keys.arrowdown){mx+=Math.sin(th);mz+=Math.cos(th)}if(keys.d||keys.arrowright){mx+=Math.cos(th);mz-=Math.sin(th)}if(keys.a||keys.arrowleft){mx-=Math.cos(th);mz+=Math.sin(th)}
 if(mx||mz){foll=false;const l=Math.hypot(mx,mz),sp=rad*.8*dt;tx=clamp(tx+mx/l*sp,-45,45);tz=clamp(tz+mz/l*sp,-45,45)}
 if(keys.q)th+=dt*1.4;if(keys.e)th-=dt*1.4;if(keys.r)rad=clamp(rad*(1-dt*1.2),8,100);if(keys.f)rad=clamp(rad*(1+dt*1.2),8,100)}
 if(foll&&sel&&!sel.home&&!sel.hid&&card.style.display==='block'){const kf=1-Math.exp(-dt*5);tx+=(sel.root.position.x-tx)*kf;tz+=(sel.root.position.z-tz)*kf}
 if(SM){if(!pts.size){th+=vth*dt*60;ph=clamp(ph+vph*dt*60,.1,1.5);const dc=Math.exp(-dt*4);vth*=dc;vph*=dc}
  const kd=1-Math.exp(-dt*9);cth+=(th-cth)*kd;cph+=(ph-cph)*kd;crad+=(rad-crad)*kd;ctx+=(tx-ctx)*kd;ctz+=(tz-ctz)*kd}
 else{vth=vph=0;cth=th;cph=ph;crad=rad;ctx=tx;ctz=tz}
 cam.position.set(ctx+crad*Math.sin(cph)*Math.sin(cth),crad*Math.cos(cph),ctz+crad*Math.sin(cph)*Math.cos(cth));cam.lookAt(ctx,0,ctz);
 drawFrame()}

$('pxb').onclick=()=>{PX=PX>=4?1:PX+1;pxLbl();resize()};

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ===== Google Chat integration =====
   1) Create an OAuth Client ID (type: Web application) in Google Cloud Console.
   2) Add this page's address under Authorized JavaScript origins.
   3) Enable the Google Chat API in the same project and paste the ID below. */
const GOOGLE_CLIENT_ID='1060489993793-2ijbhtf3ob5lc32pg8ql38slj2jgiu3g.apps.googleusercontent.com';
const G_SCOPES='openid email profile https://www.googleapis.com/auth/chat.messages https://www.googleapis.com/auth/chat.spaces.readonly https://www.googleapis.com/auth/chat.spaces.create';
const G={tok:null,exp:0,me:null,cli:null,spaces:{},msgs:[],status:'',draft:'',timer:null,busy:false,mails:{}};
try{G.mails=JSON.parse(localStorage.getItem('itmail'))||{}}catch(e){}
const gId=()=>{let v=GOOGLE_CLIENT_ID;if(!v){try{v=localStorage.getItem('itgcid')||''}catch(e){}}return v};
const saveMails=()=>{try{localStorage.setItem('itmail',JSON.stringify(G.mails))}catch(e){}};
const signed=()=>G.tok&&Date.now()<G.exp;

function gInit(){
 if(G.cli)return true;
 if(!window.google||!google.accounts||!google.accounts.oauth2)return false;
 G.cli=google.accounts.oauth2.initTokenClient({client_id:gId(),scope:G_SCOPES,callback:async r=>{
  if(r.error){G.status='Sign-in failed: '+r.error;gUI();return}
  G.tok=r.access_token;G.exp=Date.now()+(r.expires_in-60)*1000;
  try{const u=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+G.tok}})).json();G.me=u}catch(e){}
  G.status='';gUI();gOpen()}});
 return true}

function gSignIn(){
 if(!gId()){const v=prompt('Paste your Google OAuth Client ID (see the comment at the top of the Google script):');if(!v)return;try{localStorage.setItem('itgcid',v.trim())}catch(e){}}
 if(!gInit()){G.status='Google sign-in is still loading (or blocked). Try again.';gUI();return}
 G.cli.requestAccessToken({prompt:signed()?'':'consent'})}

async function gApi(path,opt){
 if(!signed()){gSignIn();throw new Error('Please sign in with Google first.')}
 const r=await fetch('https://chat.googleapis.com/v1/'+path,Object.assign({headers:{Authorization:'Bearer '+G.tok,'Content-Type':'application/json'}},opt||{}));
 if(r.status===401){G.tok=null;gUI();throw new Error('Session expired. Sign in again.')}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw Object.assign(new Error((j.error&&j.error.message)||('HTTP '+r.status)),{code:r.status});
 return j}

async function gSpace(email){
 if(G.spaces[email])return G.spaces[email];
 let sp;
 try{sp=await gApi('spaces:findDirectMessage?name='+encodeURIComponent('users/'+email))}
 catch(e){if(e.code!==404)throw e;
  sp=await gApi('spaces:setup',{method:'POST',body:JSON.stringify({space:{spaceType:'DIRECT_MESSAGE'},memberships:[{member:{name:'users/'+email,type:'HUMAN'}}]})})}
 return G.spaces[email]=sp.name}

const gEmail=()=>sel&&G.mails[sel.i]||'';
function gUI(){
 const b=$('gsign'),w=$('gwho');if(b)b.textContent=signed()?'Switch account':'Sign in with Google';
 if(w)w.textContent=signed()&&G.me?(G.me.email||''):'';
 if(sel&&card.style.display!=='none')gRender()}

function gRender(){
 let box=$('gc');if(!sel){if(box)box.remove();return}
 if(!box){box=document.createElement('div');box.id='gc';card.appendChild(box)}
 const em=gEmail(),ok=signed();
 let h=`<h3>Google Chat</h3><label>${esc(sel.name)}'s Google email<input id='gce' type='email' value='${esc(em)}' placeholder='name@yourcompany.com'></label>`;
 if(!ok)h+=`<div class='row'><button id='gci'>Sign in with Google</button></div>`;
 else if(!em)h+=`<p class='mu'>Enter an email to start chatting.</p>`;
 else h+=`<div id='gcl'></div><div class='snd'><textarea id='gct' rows='2' placeholder='Write a message (Enter to send)'>${esc(G.draft)}</textarea><button id='gcs'>Send</button></div>`;
 h+=`<p class='mu ${/fail|error|denied|expired|blocked|invalid/i.test(G.status)?'err':''}' id='gcm'>${esc(G.status)}</p>`;
 box.innerHTML=h;gList();
 const l=$('gcl');if(l)l.scrollTop=l.scrollHeight}

function gList(){
 const l=$('gcl');if(!l)return;
 const mine=G.me&&G.me.sub?'users/'+G.me.sub:'';
 l.innerHTML=G.msgs.length?G.msgs.map(m=>{const me=m.sender&&m.sender.name===mine,t=new Date(m.createTime);
  return `<div class='m${me?' me':''}'>${esc(m.text||m.formattedText||'')}<small>${me?'You':esc(sel?sel.name:'')} - ${t.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></div>`}).join(''):`<p class='mu'>No messages yet.</p>`}

async function gLoad(){
 if(!sel||!signed()||!gEmail()||G.busy)return;
 const who=sel.i;G.busy=true;
 try{const sp=await gSpace(G.mails[who]);
  const j=await gApi(sp+'/messages?pageSize=30&orderBy='+encodeURIComponent('createTime desc'));
  if(sel&&sel.i===who){const l=$('gcl'),end=l&&l.scrollTop+l.clientHeight>=l.scrollHeight-20;
   G.msgs=(j.messages||[]).reverse();gList();if(l&&end)l.scrollTop=l.scrollHeight;
   if(G.status&&!/^Sent/.test(G.status)){G.status='';const m=$('gcm');if(m)m.textContent=''}}}
 catch(e){G.status='Error: '+e.message;const m=$('gcm');if(m){m.textContent=G.status;m.className='mu err'}}
 G.busy=false}

async function gSend(){
 const t=$('gct');if(!t||!t.value.trim()||!sel)return;
 const txt=t.value.trim(),who=sel.i;
 try{const sp=await gSpace(G.mails[who]);
  await gApi(sp+'/messages',{method:'POST',body:JSON.stringify({text:txt})});
  G.draft='';t.value='';G.status='Sent.';const m=$('gcm');if(m){m.textContent=G.status;m.className='mu'}
  G.busy=false;await gLoad();const l=$('gcl');if(l)l.scrollTop=l.scrollHeight}
 catch(e){G.status='Error: '+e.message;const m=$('gcm');if(m){m.textContent=G.status;m.className='mu err'}}}

function gOpen(){G.msgs=[];clearInterval(G.timer);
 if(sel&&signed()&&gEmail()){gLoad();G.timer=setInterval(()=>{if(!sel||card.style.display==='none'){clearInterval(G.timer);return}gLoad()},8000)}}

const _drawCard=drawCard;
drawCard=function(){_drawCard();if(sel){gRender()}};
const _showCard=showCard;
showCard=function(p){G.msgs=[];G.status='';G.draft='';_showCard(p);gOpen()};

card.addEventListener('click',e=>{const id=e.target.id;
 if(id==='gci')gSignIn();else if(id==='gcs')gSend();else if(id==='cx'){clearInterval(G.timer)}});
card.addEventListener('change',e=>{if(e.target.id==='gce'&&sel){const v=e.target.value.trim();if(v)G.mails[sel.i]=v;else delete G.mails[sel.i];saveMails();G.status='';G.msgs=[];gRender();gOpen()}});
card.addEventListener('input',e=>{if(e.target.id==='gct')G.draft=e.target.value});
card.addEventListener('keydown',e=>{if(e.target.id==='gct'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();gSend()}});
$('gsign').onclick=gSignIn;
</script>
